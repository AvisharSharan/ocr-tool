<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OCR Tool</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="grain"></div>

    <main class="shell">

      <!-- ── Sidebar ── -->
      <aside class="sidebar">

        <div class="brand">
          <div class="brand-mark">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <rect x="1" y="1" width="7" height="7" rx="1.5" fill="currentColor"/>
              <rect x="10" y="1" width="7" height="7" rx="1.5" fill="currentColor" opacity=".4"/>
              <rect x="1" y="10" width="7" height="7" rx="1.5" fill="currentColor" opacity=".4"/>
              <rect x="10" y="10" width="7" height="7" rx="1.5" fill="currentColor" opacity=".15"/>
            </svg>
          </div>
          <span class="brand-name">OCR Tool</span>
          <span class="brand-sub">PaddleOCR · Gemma</span>
        </div>

        <!-- Upload -->
        <label class="upload-zone">
          <input id="file" type="file" accept="image/*,.pdf" />
          <svg class="upload-icon" width="28" height="28" viewBox="0 0 28 28" fill="none">
            <path d="M14 4v16M14 4l-5 5M14 4l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M5 22h18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".35"/>
          </svg>
          <span class="upload-text">Drop file or click</span>
          <span class="upload-hint">Images · PDF</span>
        </label>

        <!-- Preprocess toggle -->
        <label class="toggle-row">
          <input id="preprocess" type="checkbox" checked />
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
          <span class="toggle-label">Preprocess image</span>
        </label>

        <!-- Run button -->
        <button id="runOcr" class="run-btn">
          Run OCR
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M2.5 7h9M11.5 7L8 3.5M11.5 7L8 10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <div class="rule"></div>

        <!-- Status -->
        <div id="status" class="status">Ready</div>

        <div class="spacer"></div>

        <!-- AI action buttons -->
        <div class="ai-actions">
          <p class="ai-actions-heading">AI Actions</p>
          <button data-action="clean" class="action-chip">
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M2 6.5l3 3 6-6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Clean
          </button>
          <button data-action="summarize" class="action-chip">
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M2 3.5h9M2 6.5h6M2 9.5h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            Summarize
          </button>
          <button data-action="extract" class="action-chip">
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M3 1.5h4.5L10 4v7.5H3V1.5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M7.5 1.5V4H10" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
            Extract JSON
          </button>
          <button data-action="pii" class="action-chip">
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><circle cx="6.5" cy="4.5" r="2" stroke="currentColor" stroke-width="1.3"/><path d="M1.5 11c0-2 2.2-3.5 5-3.5s5 1.5 5 3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            Find PII
          </button>
        </div>

      </aside>

      <!-- ── Main ── -->
      <div class="workspace">

        <!-- OCR Panel -->
        <section class="panel">
          <header class="panel-head">
            <div class="panel-title">
              <span class="panel-eyebrow">Output</span>
              <h2>Extracted Text</h2>
            </div>
            <div class="panel-actions">
              <div class="seg">
                <button id="showFormatted" class="seg-btn active">Formatted</button>
                <button id="showRaw" class="seg-btn">Raw</button>
              </div>
              <button id="copyText" class="ghost-btn">
                <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="3.5" y="3.5" width="7" height="7" rx="1.2" stroke="currentColor" stroke-width="1.3"/><path d="M2 9V2h7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Copy
              </button>
            </div>
          </header>
          <div class="panel-body">
            <div id="ocrFormatted" class="ocr-formatted">
              <div class="empty-doc">Run OCR to view formatted text.</div>
            </div>
            <textarea id="ocrText" class="hidden" spellcheck="false"></textarea>
          </div>
        </section>

        <!-- Chat Panel -->
        <section class="panel panel--chat">
          <header class="panel-head">
            <div class="panel-title">
              <span class="panel-eyebrow">Intelligence</span>
              <h2>Chat</h2>
            </div>
            <button id="clearChat" class="ghost-btn">
              <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M2 2l9 9M11 2L2 11" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
              Clear
            </button>
          </header>
          <div class="panel-body chat-body">
            <div id="chatHistory" class="chat-history" aria-live="polite"></div>
            <form id="chatForm" class="ask-bar">
              <input id="question" placeholder="Ask about the document…" autocomplete="off" />
              <button id="ask" type="submit" class="send-btn">
                <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M2 7.5h11M13 7.5L8.5 3M13 7.5L8.5 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </form>
          </div>
        </section>

      </div>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
